<body>
<div id="auth" class="wrap"></div>

<div id="app" hidden>
  <header class="top"><div class="wrap">
    <div class="brand"><div class="eyebrow">SOGNI · familieplanlegger</div><h1 id="famName">Familien</h1></div>
    <button id="bell" class="iconbtn" aria-label="Varsler"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9a6 6 0 1 1 12 0c0 5 2 6.5 2 6.5H4S6 14 6 9"/><path d="M10 19a2 2 0 0 0 4 0"/></svg><span id="badge" class="badge" hidden>0</span></button>
    <button id="meBtn" class="avatar" aria-label="Deg"></button>
  </div></header>
  <div id="banner" class="banner" hidden><div class="wrap" id="bannerText"></div></div>
  <main class="wrap" id="view"></main>
  <nav class="tabs" aria-label="Meny"><div class="wrap">
    <button class="tab" data-tab="uke"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Uka</button>
    <button class="tab" data-tab="handle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h14l-1.2 11a2 2 0 0 1-2 1.8H8.2a2 2 0 0 1-2-1.8z"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8"/></svg>Handle</button>
    <button class="tab" data-tab="gjore"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="m8.5 12 2.5 2.5 4.5-5"/></svg>Gjøremål</button>
    <button class="tab" data-tab="middag"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="13" r="6.5"/><path d="M3 4v6a2 2 0 0 0 2 2V20M21 4c-1.5 1-2 3-2 5s1 3 2 3v8"/></svg>Middag</button>
    <button class="tab" data-tab="familie"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="9" cy="8.5" r="3"/><circle cx="17" cy="9.5" r="2.3"/><path d="M3.5 19c.6-3.2 2.8-5 5.5-5s4.9 1.8 5.5 5M14.5 14.6c.8-.4 1.6-.6 2.5-.6 2.2 0 3.6 1.5 4 4"/></svg>Familien</button>
  </div></nav>
</div>

<div id="sheetWrap" class="sheetwrap" hidden><div class="backdrop" id="backdrop"></div><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div><div id="sheetBody"></div></div></div>
<div id="toast" class="toast" hidden></div>
