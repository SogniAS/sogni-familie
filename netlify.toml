[build]
  publish = "public"
  functions = "netlify/functions"

# Supabase-adressen står med vilje i public/config.js (den er offentlig), så den skal ikke stoppe byggingen.
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_URL"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[functions]
  node_bundler = "esbuild"
  included_files = ["public/ics.js"]
